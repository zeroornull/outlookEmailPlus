[project]
name = "outlook-email-plus"
version = "2.9.11"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "flask-wtf>=1.2.0",
    "flask-cors>=4.0.0",
    "werkzeug>=3.0.0",
    "requests[socks]>=2.25.0",
    "APScheduler>=3.10.0",
    "croniter>=1.3.0",
    "bcrypt>=4.0.0",
    "cryptography>=41.0.0",
    "python-dotenv>=1.0.0",
    "docker>=6.0.0",
    "gunicorn>=23.0.0; sys_platform != 'win32'",
]

[dependency-groups]
dev = [
    "coverage",
    "flake8",
    "black",
    "isort",
    "mypy",
    "bandit[toml]",
    "pyyaml",
]

[tool.uv]
package = false

[tool.black]
line-length = 127

[tool.isort]
profile = "black"
line_length = 127

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
follow_imports = "skip"

[tool.coverage.run]
omit = [
    "*/outlookEmail-tests-*/plugins/temp_mail_providers/*.py",
    "*/outlookEmail-tests-*/plugins/temp_mail_providers/test_plugin/*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
      - master
      - dev          # dev 分支自动构建 :dev 标签
      - feat/ant-design-pro-frontend-migration
      - cursor/zer-381-frontend-polish-b985
      - cursor/railway-spa-deploy-e902
    paths:
      - '**.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'Dockerfile'
      - 'Dockerfile.legacy'
      - 'templates/**'
      - 'static/**'
      - 'ant-design-pro/**'
      - '.github/workflows/docker-build-push.yml'
      - '.dockerignore'
      - 'scripts/**'
      - 'plugins/**'
  workflow_dispatch:

concurrency:
  group: docker-build-push-${{ github.ref }}
  cancel-in-progress: true

env:
  # Docker Hub（可选）：需要配置仓库 Secrets：DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
  DOCKERHUB_IMAGE: guangshanshui/outlook-email-plus

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ant-design-pro
    env:
      HUSKY: '0'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv for release tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.9'
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Verify release version alignment
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        run: uv run --no-project --python 3.11 python scripts/check_release_version.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ant-design-pro/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          # Full hoisted rebuilds accumulate bin paths for every dependency in pnpm 10.
          pnpm rebuild esbuild
          pnpm exec max setup
      - name: Build shared SPA
        run: pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ant-design-pro/dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build-spa:
    needs: frontend
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist
      - uses: docker/setup-buildx-action@v3
      - name: Compute image name
        id: names
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/outlook-email-plus" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push native spa image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: ci-runtime
          build-contexts: |
            frontend-dist=./frontend-dist
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.names.outputs.image }}:build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=spa-runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=spa-runtime-${{ matrix.arch }}

  build-legacy:
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv for release tags
        if: startsWith(github.ref, 'refs/tags/')
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.13.9'
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Verify release version alignment
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        run: uv run --no-project --python 3.11 python scripts/check_release_version.py
      - uses: docker/setup-buildx-action@v3
      - name: Compute image name
        id: names
        shell: bash
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/outlook-email-plus-legacy" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push native legacy image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.legacy
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.names.outputs.image }}:build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=legacy-runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=legacy-runtime-${{ matrix.arch }}

  merge:
    needs: [build-spa, build-legacy]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [spa, legacy]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - name: Compute publication names
        id: names
        shell: bash
        env:
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          suffix=""
          if [ "${{ matrix.variant }}" = legacy ]; then suffix="-legacy"; fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/outlook-email-plus${suffix}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          if [ -n "$HUB_USER" ] && [ -n "$HUB_TOKEN" ]; then
            echo "dockerhub_enabled=true" >> "$GITHUB_OUTPUT"
            echo "images=$image,${{ env.DOCKERHUB_IMAGE }}${suffix}" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub_enabled=false" >> "$GITHUB_OUTPUT"
            echo "images=$image" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        if: steps.names.outputs.dockerhub_enabled == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Extract publication metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.images }}
          tags: |
            type=ref,event=branch,suffix=${{ steps.names.outputs.suffix }}
            type=ref,event=tag,suffix=${{ steps.names.outputs.suffix }}
            type=sha,prefix={{branch}}-,suffix=${{ steps.names.outputs.suffix }},enable=${{ startsWith(github.ref, 'refs/heads/') }}
            type=sha,prefix={{tag}}-,suffix=${{ steps.names.outputs.suffix }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=latest${{ steps.names.outputs.suffix }},enable=${{ github.ref_name == 'main' || github.ref_name == 'master' }}
      - name: Publish multi-platform manifests
        shell: bash
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          SOURCE="$IMAGE:build-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            tag_args+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${tag_args[@]}" "$SOURCE-amd64" "$SOURCE-arm64"

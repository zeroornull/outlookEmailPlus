name: OAuth Client Secret Image

on:
  push:
    branches:
      - fix/oauth-client-secret
    paths:
      - '.github/workflows/oauth-client-secret-image.yml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.python-version'
      - '*.py'
      - 'outlook_web/**'
      - 'ant-design-pro/**'
      - 'templates/**'
      - 'static/**'
      - 'plugins/**'
      - 'scripts/**'
      - 'tests/**'
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oauth-client-secret-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ant-design-pro
    env:
      HUSKY: '0'
      CI: 'true'
    steps:
      - name: Checkout dispatched revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: ant-design-pro/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm rebuild esbuild
          pnpm exec max setup

      - name: Build SPA once
        run: pnpm run build

      - name: Upload shared SPA
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ant-design-pro/dist/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  build-and-push:
    needs: frontend
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout dispatched revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download shared SPA
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image names
        id: names
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/outlook-email-plus" >> "$GITHUB_OUTPUT"
          echo "immutable_tag=oauth-secret-${GITHUB_SHA}-${{ matrix.arch }}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.names.outputs.immutable_tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push SPA image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          target: ci-runtime
          build-contexts: |
            frontend-dist=./frontend-dist
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=spa-runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=spa-runtime-${{ matrix.arch }}

  merge:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge native images and publish verified coordinates
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/outlook-email-plus"
          IMMUTABLE_TAG="oauth-secret-${GITHUB_SHA}"
          docker buildx imagetools create \
            --tag "${IMAGE}:${IMMUTABLE_TAG}" \
            --tag "${IMAGE}:oauth-secret" \
            "${IMAGE}:${IMMUTABLE_TAG}-amd64" \
            "${IMAGE}:${IMMUTABLE_TAG}-arm64"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${IMMUTABLE_TAG}" --format '{{.Manifest.Digest}}')
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" --raw > manifest.json
          jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture]
            | (index("amd64") != null and index("arm64") != null)
          ' manifest.json
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}"
          echo "Image: ${IMAGE}:${IMMUTABLE_TAG}"
          echo "Digest: ${DIGEST}"
          echo "Pinned image: ${IMAGE}@${DIGEST}"
          {
            echo '### OAuth client secret SPA image'
            echo
            echo "- Image: \`${IMAGE}:${IMMUTABLE_TAG}\`"
            echo "- Moving tag: \`${IMAGE}:oauth-secret\`"
            echo "- Index digest: \`${DIGEST}\`"
            echo "- Deploy by digest: \`${IMAGE}@${DIGEST}\`"
            echo '- Verified platforms: linux/amd64, linux/arm64'
          } >> "$GITHUB_STEP_SUMMARY"

name: OAuth Client Secret Image

on:
  push:
    branches:
      - fix/oauth-client-secret
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oauth-client-secret-image
  cancel-in-progress: false

jobs:
  oauth-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dispatched revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run OAuth and token refresh regression tests
        run: >-
          python -m unittest -v
          tests.test_oauth_tool
          tests.test_oauth_client_credentials
          tests.test_graph_permission_precheck
          tests.test_imap_token_cache
          tests.test_web_graph_auth_fallback

  build-and-push:
    needs: oauth-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.names.outputs.image }}
      immutable-tag: ${{ steps.names.outputs.immutable_tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout dispatched revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image names
        id: names
        shell: bash
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/outlook-email-plus" >> "$GITHUB_OUTPUT"
          echo "immutable_tag=oauth-secret-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.names.outputs.immutable_tag }}
            type=raw,value=oauth-secret
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push SPA image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=oauth-client-secret-spa
          cache-to: type=gha,mode=max,scope=oauth-client-secret-spa

      - name: Publish image coordinates
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          IMMUTABLE_TAG: ${{ steps.names.outputs.immutable_tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          echo "Image: ${IMAGE}:${IMMUTABLE_TAG}"
          echo "Digest: ${DIGEST}"
          echo "Pinned image: ${IMAGE}@${DIGEST}"
          {
            echo '### OAuth client secret SPA image'
            echo
            echo "- Image: \`${IMAGE}:${IMMUTABLE_TAG}\`"
            echo "- Moving tag: \`${IMAGE}:oauth-secret\`"
            echo "- Digest: \`${DIGEST}\`"
            echo "- Deploy by digest: \`${IMAGE}@${DIGEST}\`"
            echo '- Platforms: linux/amd64, linux/arm64'
          } >> "$GITHUB_STEP_SUMMARY"
